<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Celestina | 投稿管理</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#10101b;color:#f1edf8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#28203c,#10101b 60%);min-height:100vh}main{max-width:680px;margin:auto;padding:30px 18px 80px}h1{font-family:Georgia,serif;font-weight:400;font-size:30px;letter-spacing:.04em}h1 span{color:#cfb6ec}.muted{color:#a9a1b8;font-size:13px;line-height:1.7}section{background:#1b1928;border:1px solid #40364d;border-radius:18px;padding:20px;margin:20px 0}label{display:block;margin:15px 0 7px;font-size:13px;color:#ddd2eb}input,textarea,select{width:100%;padding:13px;border:1px solid #50435f;border-radius:10px;background:#11111d;color:white;font:inherit}textarea{min-height:105px;resize:vertical}input[type=file]{font-size:13px}button{cursor:pointer;border:0;border-radius:11px;padding:13px 16px;font-weight:650;font-size:14px;background:#bca3d6;color:#1a1422}button.secondary{background:#363044;color:#f4ebfc}button.danger{background:#632d42;color:white}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.actions button{flex:1;min-width:120px}.row{display:flex;align-items:center;gap:12px}.row>*{flex:1}.image{max-height:340px;max-width:100%;object-fit:contain;display:block;margin:16px auto;border-radius:12px}#message{white-space:pre-wrap;line-height:1.7;padding:14px;border-radius:10px;background:#29263a}#message:empty{display:none}.hidden{display:none!important}a{color:#c9afe9}.small{font-size:12px;color:#ada4ba}
</style></head><body><main><p class="muted">☾ PRIVATE EDITOR</p><h1>Today's <span>Celestina</span></h1><p class="muted">画像を選んで、日記を書いて、公開するだけ。</p><section><label for="date">日付</label><input type="date" id="date"><div class="actions"><button class="secondary" id="load">この日の投稿を読み込む</button><button class="secondary" id="new">新規入力に戻す</button></div><p id="existing" class="small"></p><label for="image">画像（PNG / JPEG / 対応しているHEIC）</label><input type="file" id="image" accept="image/png,image/jpeg,image/heic,image/heif,image/*"><img id="preview" class="image hidden" alt="画像プレビュー"><p class="small">新規投稿は画像必須。既存投稿は画像を選ばなければ文章のみ変更できます。変換後8MB以内。</p><label for="title">タイトル</label><input id="title" maxlength="120" placeholder="今日のタイトル"><label for="caption">キャプション</label><textarea id="caption" maxlength="2000" placeholder="改行は自動的に <br> に変換されます"></textarea><div class="actions"><button id="save">☾ GitHubに公開</button><button id="delete" class="danger">この日を削除</button></div></section><div id="message" role="status" aria-live="polite"></div><p class="muted"><a href="/">← 公開サイトへ戻る</a></p></main><script>
'use strict';const $=id=>document.getElementById(id);let exists=false,oldImage=false,busy=false;const max=8*1024*1024;
const today=new Date();$('date').value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');
const key=()=> $('date').value.replaceAll('-','');const say=(s)=>{$('message').textContent=s};const setBusy=v=>{busy=v;for(const id of ['save','delete','load'])$(id).disabled=v};
function reset(){exists=false;oldImage=false;$('image').value='';$('title').value='';$('caption').value='';$('preview').src='';$('preview').classList.add('hidden');$('existing').textContent='新規投稿';say('')}
$('new').onclick=reset;$('date').onchange=reset;
$('image').onchange=()=>{const f=$('image').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hidden')}else if(!oldImage){$('preview').classList.add('hidden')}};
async function request(url,options){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});const text=await r.text();let data;try{data=JSON.parse(text)}catch{throw Error('API応答を確認できません。Cloudflare AccessとFunctionsの設定を確認してください。('+r.status+')')}if(!r.ok)throw Error(data.error||'HTTP '+r.status);return data}
$('load').onclick=async()=>{if(!key())return;say('読み込み中…');setBusy(true);try{const data=await request('/api/posts?date='+key());exists=data.exists;oldImage=exists;if(exists){$('title').value=data.title;$('caption').value=data.caption.replace(/<br\s*\/?\s*>/gi,'\n');$('preview').src='/gallery/'+key()+'.png?t='+Date.now();$('preview').classList.remove('hidden');$('existing').textContent='投稿済み：編集できます';say('既存の投稿を読み込みました。')}else{reset();say('この日付は未投稿です。新規投稿できます。')}}catch(e){say('エラー：'+e.message)}finally{setBusy(false)}};
async function pngBase64(file){if(!file)return null;let bitmap;try{bitmap=await createImageBitmap(file)}catch{throw Error('画像を読み込めません。HEICの場合は写真アプリからJPEG/PNGとして保存してください。')}const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;if(canvas.width*canvas.height>32000000)throw Error('画像の画素数が大きすぎます（最大3200万画素）。');canvas.getContext('2d').drawImage(bitmap,0,0);bitmap.close?.();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob||blob.size>max)throw Error('PNG変換後の画像が8MBを超えました。画像を縮小してください。');return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)})}
$('save').onclick=async()=>{if(busy)return;const date=key(),title=$('title').value.trim(),caption=$('caption').value.trim(),file=$('image').files[0];if(!/^20\d{6}$/.test(date)||!title||!caption){say('日付・タイトル・キャプションを入力してください。');return}if(!exists&&!file){say('新規投稿には画像が必要です。');return}if(exists&&!confirm(date+' の投稿を更新しますか？'))return;setBusy(true);say('画像を処理しています…');try{const image=await pngBase64(file);say('GitHubにコミットしています…');const data=await request('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',date,title,caption:caption.replace(/\r?\n/g,'<br>'),image})});exists=true;oldImage=true;say('公開コミット完了！\n'+data.commitUrl+'\nCloudflare Pagesの反映には少し時間がかかる場合があります。')}catch(e){say('エラー：'+e.message)}finally{setBusy(false)}};
$('delete').onclick=async()=>{if(!exists){say('削除するには、まず既存の投稿を読み込んでください。');return}const date=key();if(!confirm(date+' の画像・文章を削除します。よろしいですか？'))return;if(!confirm('最終確認：この投稿をGitHubから削除しますか？'))return;setBusy(true);say('削除コミット中…');try{const data=await request('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',date})});reset();say('削除コミット完了！\n'+data.commitUrl)}catch(e){say('エラー：'+e.message)}finally{setBusy(false)}};
reset();
</script></body></html>
