<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Celestina | 投稿管理</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#15121d;color:#f7f0fc;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}main{max-width:660px;margin:auto;padding:30px 18px 70px}h1{font-family:Georgia,serif;font-size:30px;color:#e5d4ff}p,.hint{color:#c5b8d2;line-height:1.7}label{display:block;margin:18px 0 7px;font-weight:600}input,textarea,button{font:inherit}input,textarea{width:100%;background:#272133;border:1px solid #675876;color:#fff;padding:13px;border-radius:10px}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:10px;padding:13px 17px;background:#a78cce;color:#160e22;font-weight:700;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#373047;color:#f3e7ff}button.danger{background:#8f4858;color:white}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.row>*{flex:1}img{display:block;width:100%;max-height:340px;object-fit:contain;margin:14px 0;border-radius:12px;background:#292337}small{color:#c7b9d6}#status{white-space:pre-wrap;line-height:1.6;padding:14px;border-radius:10px;background:#2c2538;margin-top:20px}a{color:#e4c8ff}code{color:#e9c8fa}</style></head><body><main><h1>☾ Today's Celestina</h1><p>投稿・編集・削除｜GitHub mainへ一括コミット</p><label for="token">GitHub Fine-grained PAT</label><input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_..."><small>トークンはこの画面のメモリ内のみ。再読み込みで消えます。公開端末では使用しないでください。</small><label for="date">日付</label><input id="date" type="date"><div class="row"><button id="load" class="secondary">この日の投稿を読み込む</button><button id="clear" class="secondary">新規入力に戻す</button></div><label for="image">画像（PNG / JPEG / Safariで読めるHEIC）</label><input id="image" type="file" accept="image/png,image/jpeg,image/heic,image/heif,image/*"><small>ブラウザでPNGへ変換。既存投稿の文章だけ変更する場合、画像の選択は不要です。PNG最大8MiB。</small><img id="preview" hidden alt="画像プレビュー"><label for="title">タイトル</label><input id="title" maxlength="120" placeholder="タイトル（カンマ不可）"><label for="caption">キャプション</label><textarea id="caption" maxlength="2000" placeholder="改行は自動で <br> に変換します"></textarea><div class="row"><button id="save">GitHubに公開・更新</button><button id="delete" class="danger">この日を削除</button></div><div id="status" role="status" aria-live="polite">準備完了。まずトークンを入力してください。</div><p class="hint">管理画面のコードは公開されます。トークンをブラウザに入力する方式なので、信頼できる端末・公式ドメインのみで使用してください。</p></main><script>
(()=>{'use strict';const OWNER='vonjovi14',REPO='celestina',BRANCH='main',API=`https://api.github.com/repos/${OWNER}/${REPO}`;const $=id=>document.getElementById(id);let selectedImage=null,oldImageURL=null,busy=false;const say=s=>$('status').textContent=s;const dateKey=()=>{const s=$('date').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(s))throw Error('日付を選択してください');return s.replaceAll('-','')};const headers=()=>{const t=$('token').value.trim();if(!t)throw Error('GitHubトークンを入力してください');return {'Authorization':`Bearer ${t}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}};async function gh(path,options={}){const res=await fetch(API+'/'+path,{...options,headers:{...headers(),...(options.body?{'Content-Type':'application/json'}:{})},cache:'no-store'});if(res.status===404&&options.allow404)return null;const data=await res.json().catch(()=>null);if(!res.ok)throw Error(`GitHub ${res.status}: ${data?.message||'API error'}`);return data}const encode=s=>new TextEncoder().encode(s);function toBase64(bytes){let out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out)}function fromBase64(s){const binary=atob(s.replace(/\s/g,''));return Uint8Array.from(binary,c=>c.charCodeAt(0))}async function getText(path){const f=await gh(`contents/${path}?ref=${BRANCH}`,{allow404:true});if(!f)return null;if(f.content)return new TextDecoder().decode(fromBase64(f.content));const res=await fetch(f.download_url,{cache:'no-store'});if(!res.ok)throw Error('ファイルを読み込めません');return res.text()}async function getImage(path){const f=await gh(`contents/${path}?ref=${BRANCH}`,{allow404:true});if(!f)return null;return f.download_url}function showPreview(url){if(oldImageURL)URL.revokeObjectURL(oldImageURL);oldImageURL=url?.startsWith('blob:')?url:null;$('preview').hidden=!url;if(url)$('preview').src=url;else $('preview').removeAttribute('src')}async function png(file){let bitmap;try{bitmap=await createImageBitmap(file)}catch{throw Error('この画像形式はSafariで読み込めません。JPEGかPNGに変換してください')}try{if(bitmap.width*bitmap.height>32000000)throw Error('画像が大きすぎます（3200万画素まで）');const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;canvas.getContext('2d').drawImage(bitmap,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG変換に失敗しました');if(blob.size>8*1024*1024)throw Error('PNG変換後の容量が8MiBを超えました');return new Uint8Array(await blob.arrayBuffer())}finally{bitmap.close?.()}}async function lock(task){if(busy)return;busy=true;for(const b of document.querySelectorAll('button'))b.disabled=true;try{await task()}catch(e){say('エラー：'+e.message)}finally{busy=false;for(const b of document.querySelectorAll('button'))b.disabled=false}}function reset(){selectedImage=null;$('image').value='';$('title').value='';$('caption').value='';showPreview(null);say('新規入力モードです。')}async function load(){const d=dateKey();say('GitHubから読み込み中…');const text=await getText(`gallery/${d}.txt`);if(text===null){reset();say(`${d} の投稿はありません。新規投稿できます。`);return}const pos=text.indexOf(',');$('title').value=pos<0?text.trim():text.slice(0,pos).trim();$('caption').value=pos<0?'':text.slice(pos+1).trim().replace(/<br\s*\/?>/gi,'\n');selectedImage=null;$('image').value='';showPreview(await getImage(`gallery/${d}.png`));say(`${d} を読み込みました。文章だけの変更も可能です。`)}async function publish(action){const d=dateKey();const title=$('title').value.trim(),caption=$('caption').value.trim().replace(/\r\n?|\n/g,'<br>');if(action==='save'&&(!title||!caption||title.includes(',')||/[\r\n]/.test(title)))throw Error('タイトル・キャプションを入力してください。タイトルにカンマ・改行は使えません');say('GitHubの最新状態を確認中…');const ref=await gh(`git/ref/heads/${BRANCH}`),head=ref.object.sha,commit=await gh(`git/commits/${head}`);const raw=await getText('gallery/index.json');if(raw===null)throw Error('gallery/index.jsonがありません');let dates=JSON.parse(raw);if(!Array.isArray(dates))throw Error('index.jsonの形式が不正です');const exists=dates.includes(d);if(action==='delete'&&!exists)throw Error('この日付はindex.jsonにありません');if(action==='save'&&!exists&&!selectedImage)throw Error('新規投稿には画像が必要です');if(action==='save'&&exists&&!confirm(`${d} の投稿を上書きします。よろしいですか？`))return;if(action==='delete'&&!confirm(`${d} の画像と文章を削除します。よろしいですか？`))return;if(action==='delete'&&!confirm('本当に削除しますか？GitHubの履歴から復旧は可能ですが、サイトから消えます。'))return;dates=action==='delete'?dates.filter(x=>x!==d):[...new Set([...dates,d])];dates.sort((a,b)=>b.localeCompare(a));const tree=[];async function blob(path,content,encoding){const data=await gh('git/blobs',{method:'POST',body:JSON.stringify({content,encoding})});tree.push({path,mode:'100644',type:'blob',sha:data.sha})}await blob('gallery/index.json',JSON.stringify(dates,null,2)+'\n','utf-8');if(action==='delete'){tree.push({path:`gallery/${d}.txt`,mode:'100644',type:'blob',sha:null},{path:`gallery/${d}.png`,mode:'100644',type:'blob',sha:null})}else{await blob(`gallery/${d}.txt`,`${title},${caption}`,'utf-8');if(selectedImage){say('PNGを変換・アップロード中…');const bytes=await png(selectedImage);await blob(`gallery/${d}.png`,toBase64(bytes),'base64')}}say('変更を1コミットにまとめています…');const newTree=await gh('git/trees',{method:'POST',body:JSON.stringify({base_tree:commit.tree.sha,tree})});const newCommit=await gh('git/commits',{method:'POST',body:JSON.stringify({message:`Celestina: ${action==='delete'?'delete':'publish'} ${d}`,tree:newTree.sha,parents:[head]})});await gh(`git/refs/heads/${BRANCH}`,{method:'PATCH',body:JSON.stringify({sha:newCommit.sha,force:false})});selectedImage=null;$('image').value='';if(action==='delete'){$('title').value='';$('caption').value='';showPreview(null)}say(`完了！ ${d} をGitHub mainへ1コミットで${action==='delete'?'削除':'保存'}しました。\nCommit: ${newCommit.sha.slice(0,12)}\nCloudflare Pagesの反映まで少し時間がかかる場合があります。`)}$('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);$('image').addEventListener('change',()=>{selectedImage=$('image').files?.[0]||null;if(selectedImage)showPreview(URL.createObjectURL(selectedImage))});$('load').onclick=()=>lock(load);$('clear').onclick=reset;$('save').onclick=()=>lock(()=>publish('save'));$('delete').onclick=()=>lock(()=>publish('delete'));})();
</script></body></html>
